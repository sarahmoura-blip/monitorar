<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Temperatura - Unimed Vacinas</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #009639;
            --primary-hover: #00702a;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary);
            font-size: 22px;
        }

        header p {
            font-size: 13px;
            color: #718096;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            display: block;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .btn-pdf {
            background: #2d3748;
        }
        .btn-pdf:hover {
            background: #1a202c;
        }

        .status-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .status-success { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
        .status-error { background: #fed7d7; color: #9b2c2c; border-left: 4px solid #e53e3e; }
        .status-warning { background: #feebc8; color: #9c4221; border-left: 4px solid #dd6b20; }

        .history-box {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .history-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a5568;
            display: flex;
            justify-content: space-between;
        }

        .clear-data {
            color: #e53e3e;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Controle de Temperatura</h1>
            <p>Unimed Vacinas — Registro de Campo</p>
        </header>

        <div class="form-group">
            <label for="tecnicaNome">Nome da Técnica:</label>
            <input type="text" id="tecnicaNome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="tempInput">Temperatura da Caixa (°C):</label>
            <input type="text" id="tempInput" inputmode="decimal" placeholder="Ex: 4.5">
        </div>

        <button type="button" onclick="registrarDados()">💾 Gravar Registro</button>
        
        <div id="status" class="status-msg"></div>
    </div>

    <div class="history-box">
        <div class="history-title">
            <span>Ações de Fechamento</span>
            <span class="clear-data" onclick="limparHistorico()">Limpar memória</span>
        </div>
        <p style="font-size: 12px; color: #718096; margin-bottom: 10px;">
            Os dados acumulados ficam salvos neste telemóvel. Descarregue o relatório no final do período.
        </p>
        <button class="btn-pdf" type="button" onclick="exportarPDF()">📄 Baixar Relatório em PDF</button>
        <p id="contador" style="font-size: 12px; text-align: center; margin-top: 8px; font-weight: bold;"></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            atualizarContador();
            // Tenta recuperar o último nome utilizado para poupar tempo à técnica
            const ultimoNome = localStorage.getItem("ultimo_nome_tecnica");
            if (ultimoNome) {
                document.getElementById("tecnicaNome").value = ultimoNome;
            }
        });

        function atualizarContador() {
            const registros = JSON.parse(localStorage.getItem("registros_temp")) || [];
            document.getElementById("contador").textContent = `Registros na memória local: ${registros.length}`;
        }

        function registrarDados() {
            const nome = document.getElementById("tecnicaNome").value.trim();
            let tempRaw = document.getElementById("tempInput").value.trim();

            if (!nome || !tempRaw) {
                mostrarStatus("Por favor, preencha o nome e a temperatura.", "error");
                return;
            }

            tempRaw = tempRaw.replace(",", ".");
            const temperatura = parseFloat(tempRaw);

            if (isNaN(temperatura)) {
                mostrarStatus("Temperatura inválida. Use apenas números.", "error");
                return;
            }

            // Salva o nome para os próximos registros
            localStorage.setItem("ultimo_nome_tecnica", nome);

            mostrarStatus("Buscando sinal de GPS...", "warning");

            const agora = new Date();
            const dataStr = agora.toLocaleDateString('pt-BR');
            const horaStr = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Executa a gravação dos dados final
            function salvarNoBanco(coordenadasTexto) {
                const novoRegistro = {
                    nome: nome,
                    temperatura: temperatura.toFixed(1) + " °C",
                    data: dataStr,
                    hora: horaStr,
                    coordenadas: coordenadasTexto
                };

                const registrosExistentes = JSON.parse(localStorage.getItem("registros_temp")) || [];
                registrosExistentes.push(novoRegistro);
                localStorage.setItem("registros_temp", JSON.stringify(registrosExistentes));

                document.getElementById("tempInput").value = ""; 
                atualizarContador();
            }

            // Captura GPS com tolerância a falhas (timeout de 5 segundos)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        salvarNoBanco(`${lat}, ${lon}`);
                        mostrarStatus(`✓ Sucesso! Temperatura: ${temperatura.toFixed(1)}°C | GPS: OK`, "success");
                    },
                    (error) => {
                        // Se o GPS falhar ou for rejeitado, salva mesmo assim usando a hora
                        salvarNoBanco("GPS indisponível/bloqueado");
                        mostrarStatus(`✓ Registrado sem GPS! Temp: ${temperatura.toFixed(1)}°C (Ative a localização do aparelho)`, "success");
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                salvarNoBanco("Aparelho sem suporte a GPS");
                mostrarStatus(`✓ Gravado! Temp: ${temperatura.toFixed(1)}°C | Sem suporte a GPS`, "success");
            }
        }

        function mostrarStatus(msg, tipo) {
            const div = document.getElementById("status");
            div.style.display = "block";
            div.className = `status-msg status-${tipo}`;
            div.textContent = msg;
        }

        function limparHistorico() {
            if (confirm("Deseja limpar todos os registros salvos neste aparelho?")) {
                localStorage.removeItem("registros_temp");
                atualizarContador();
                mostrarStatus("Memória limpa com sucesso.", "success");
            }
        }

        function exportarPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const registros = JSON.parse(localStorage.getItem("registros_temp")) || [];

                if (registros.length === 0) {
                    alert("Não existem registros na memória para exportar.");
                    return;
                }

                doc.setFont("Helvetica", "bold");
                doc.setFontSize(16);
                doc.text("RELATÓRIO DE TEMPERATURA DE CAIXAS TÉRMICAS", 14, 20);
                
                doc.setFont("Helvetica", "normal");
                doc.setFontSize(10);
                doc.text(`Data de Emissão: ${new Date().toLocaleDateString('pt-BR')}`, 14, 27);
                doc.text(`Total de Registros: ${registros.length}`, 14, 32);
                
                const colunas = ["Técnica", "Temperatura", "Data", "Hora", "Coordenadas (GPS)"];
                const linhas = registros.map(item => [item.nome, item.temperatura, item.data, item.hora, item.coordenadas]);

                doc.autoTable({
                    head: [colunas],
                    body: linhas,
                    startY: 38,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 150, 57], fontStyle: 'bold' }, 
                    styles: { fontSize: 9, cellPadding: 3 },
                    columnStyles: { 4: { cellWidth: 50 } }
                });

                const dataNome = new Date().toISOString().slice(0,10);
                doc.save(`Relatorio_Temperatura_${dataNome}.pdf`);
            } catch (err) {
                alert("Erro ao criar PDF: " + err.message);
            }
        }
    </script>
</body>
</html>
